<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 240" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brutalist Grid Pattern -->
    <pattern id="grid42" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <!-- Scanline effect overlay -->
    <pattern id="scanlines42" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.5" stroke-opacity="0.35" />
    </pattern>

    <!-- High-contrast Grayscale filter matching alexmatos.dev -->
    <filter id="acid-bw">
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0.33 0.33 0.33 0 0
                                           0    0    0    1 0" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.25" intercept="-0.1" />
        <feFuncG type="linear" slope="1.25" intercept="-0.1" />
        <feFuncB type="linear" slope="1.25" intercept="-0.1" />
      </feComponentTransfer>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulse-dot {
      animation: blink 1.2s infinite;
    }
  </style>

  <!-- Background base: #0d0d0d -->
  <rect width="680" height="240" rx="2" fill="#0d0d0d" />
  <rect width="680" height="240" fill="url(#grid42)" />
  <rect width="680" height="240" fill="url(#scanlines42)" pointer-events="none" />

  <!-- Outer brutalist double frame in crimson #c82a2a -->
  <rect x="8" y="8" width="664" height="224" fill="none" stroke="#c82a2a" stroke-width="1.5" />
  <rect x="12" y="12" width="656" height="216" fill="none" stroke="#c82a2a" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Top-left Corner Badge: 42_MADRID -->
  <rect x="22" y="2" width="95" height="18" fill="#c82a2a" />
  <text x="69.5" y="14.5" class="mono" font-size="9.5" font-weight="bold" fill="#0d0d0d" text-anchor="middle" letter-spacing="1.5">42_MADRID</text>

  <!-- Top-right Telemetry -->
  <circle cx="525" cy="21" r="3.5" fill="#c82a2a" class="pulse-dot" />
  <text x="656" y="24" class="mono" font-size="9" fill="#c82a2a" opacity="0.9" text-anchor="end" letter-spacing="1">[ CADET // ACTIVE_STUDENT ]</text>

  <!-- Left: Photo Frame in Acid Brutalist style -->
  <rect x="28" y="38" width="94" height="94" fill="#161616" stroke="#c82a2a" stroke-width="1.5" />
  <image href="data:image/jpeg;base64," x="30" y="40" width="90" height="90" preserveAspectRatio="xMidYMid slice" filter="url(#acid-bw)" />
  
  <!-- Red tint overlay on hover/visual -->
  <rect x="30" y="40" width="90" height="90" fill="#c82a2a" opacity="0.15" mix-blend-mode="multiply" />

  <!-- Photo subtitle: login -->
  <rect x="28" y="136" width="94" height="19" fill="#121212" stroke="#c82a2a" stroke-width="1" />
  <text x="75" y="149" class="mono" font-size="9.5" font-weight="bold" fill="#e0e0e0" text-anchor="middle" letter-spacing="1">alematos</text>

  <!-- Center: Student Details -->
  <text x="142" y="60" class="mono" font-size="18" font-weight="800" fill="#e0e0e0" letter-spacing="-0.5">ALEXANDER MATOS</text>
  <text x="142" y="80" class="mono" font-size="11" font-weight="600" fill="#c82a2a" letter-spacing="0.5">CURSUS: 42cursus  ·  GRADE: Cadet</text>
  <text x="142" y="98" class="mono" font-size="9.5" fill="#888888" letter-spacing="0.2">alematos@student.42madrid.com</text>

  <!-- Fine Divider -->
  <line x1="142" y1="112" x2="640" y2="112" stroke="#252525" stroke-width="1" />

  <!-- Level Progress Section -->
  <text x="142" y="132" class="mono" font-size="11" font-weight="700" fill="#e0e0e0" letter-spacing="0.8">PROGRESS // LEVEL 1</text>
  <text x="470" y="132" class="mono" font-size="11" font-weight="800" fill="#c82a2a" text-anchor="end">69%</text>

  <!-- Progress Bar Container -->
  <rect x="142" y="140" width="328" height="14" fill="#141414" stroke="#c82a2a" stroke-width="1" />
  <!-- Progress Bar Fill (69% of 324 = 224px) -->
  <rect x="144" y="142" width="224" height="10" fill="#c82a2a" />
  
  <!-- Segment lines inside progress bar -->
  <line x1="180" y1="142" x2="180" y2="152" stroke="#0d0d0d" stroke-width="1.5" />
  <line x1="220" y1="142" x2="220" y2="152" stroke="#0d0d0d" stroke-width="1.5" />
  <line x1="260" y1="142" x2="260" y2="152" stroke="#0d0d0d" stroke-width="1.5" />
  <line x1="300" y1="142" x2="300" y2="152" stroke="#0d0d0d" stroke-width="1.5" />
  <line x1="340" y1="142" x2="340" y2="152" stroke="#0d0d0d" stroke-width="1.5" />

  <!-- Badges Row -->
  <rect x="142" y="168" width="75" height="20" fill="#c82a2a" />
  <text x="179.5" y="181.5" class="mono" font-size="9" font-weight="bold" fill="#0d0d0d" text-anchor="middle" letter-spacing="1">CADET</text>

  <rect x="225" y="168" width="180" height="20" fill="#121212" stroke="#c82a2a" stroke-width="1" />
  <text x="315" y="181.5" class="mono" font-size="9" font-weight="600" fill="#e0e0e0" text-anchor="middle" letter-spacing="0.5">C · ALGORITHMS · UNIX</text>

  <!-- Official 42 Logo on right side (scaled & styled) -->
  <g transform="translate(505, 128) scale(1.6)">
    <!-- 4 -->
    <path d="M11.813 0H7.874L0 7.875v3.188h7.875V15h3.938V7.875H3.936L11.814 0zM13.5 3.938L17.438 0H13.5v3.938z" fill="#e0e0e0" />
    <path d="M21.375 3.938V0h-3.938v3.938L13.5 7.874v3.938h3.938V7.874l3.937-3.938z" fill="#e0e0e0" />
    <!-- 2 -->
    <path d="M21.375 7.875l-3.938 3.938h3.938V7.874z" fill="#c82a2a" />
  </g>

  <!-- Bottom Telemetry Status Line -->
  <text x="28" y="220" class="mono" font-size="8.5" fill="#555555" letter-spacing="1">+--- 42_NETWORK // MADRID CAMPUS --- SYS_VERIFIED ---+</text>
</svg>